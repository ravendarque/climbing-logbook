<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climbing Logbook</title>
  <link rel="manifest" href="/logbook/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/logbook/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/logbook/favicon-16.png">
  <link rel="apple-touch-icon" href="/logbook/apple-touch-icon.png">
  <meta name="theme-color" content="#ff2727">
  <!-- Genuinely static shell (#351), same pattern as public/map,
       public/performance, public/log -- see any of those files' own
       comment for why every path below is absolute and
       client/profile-main.js reads the username from location.pathname
       itself rather than this file being templated. Unlike those three
       (owner-only, session-gated), src/api/public-profile.js's own gate
       (logbook_public + anti-enumeration 404) runs *before* this shell is
       ever served -- a private or nonexistent username never reaches this
       file at all. -->
  <link rel="stylesheet" href="/logbook/tailwind.css">
  <script src="/logbook/components/climbing-header.js"></script>
  <script>
    (function () {
      var stored = localStorage.getItem("logbook_theme");
      var theme = stored || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body class="bg-background text-foreground font-sans px-4 pt-6 pb-16 min-w-[300px]">
<div class="max-w-[960px] mx-auto">
  <climbing-header variant="brand"></climbing-header>

  <!-- admin-hidden (#351): login/Athlete Mode are never reachable on this
       read-only page at all (no admin-auth.js/store.js session wiring
       exists in client/profile-main.js), so those rows are absent from
       the DOM entirely, not just CSS-hidden -- see that component's own
       comment. -->
  <div class="flex items-center justify-end gap-2 mb-6" id="header-row">
    <climbing-menu-bar admin-hidden></climbing-menu-bar>
  </div>

  <!-- No <climbing-tab-bar> here -- Map isn't included yet (own
       follow-up, see #351's body) and Grade Pyramid never is, so there's
       only ever this one page to link to; a tab bar with a single tab
       would be meaningless. -->

  <!-- Not `editable` -- readonly by construction, matching this page's
       whole point. No entry-form.js/place-picker.js/offline-sync.js
       import anywhere in client/profile-main.js either ("security by
       absence", #344's decision), so there'd be nothing to wire an
       edit-btn click to even if this were set. -->
  <climbing-entries-table></climbing-entries-table>

  <div class="text-center text-muted text-[.78rem] mt-8" id="footer"></div>
</div>

<script type="module" src="/logbook/profile-app.js"></script>
</body>
</html>
