<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climbing Logbook</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./logbook/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./logbook/favicon-16.png">
  <meta name="theme-color" content="#ff2727">
  <!-- Same shared stylesheet/font/favicon assets as public/logbook/ and
       the other apex pages (public/register/, public/login/) -- see
       public/login/index.html's own comment for why these are referenced
       rather than duplicated. -->
  <link rel="stylesheet" href="./logbook/tailwind.css">
  <style>
    /* Same token subset as public/login/index.html -- see that file's
       own comment for why this is duplicated rather than shared. */
    :root {
      --color-bg:          #0f0f0f;
      --color-surface:     #1a1a1a;
      --color-text:        #f0f0f0;
      --color-text-muted:  #a0a0a0;
      --color-accent:      #ff2727;
      --color-accent-text: #ffffff;
      --color-border:      #2e2e2e;
      --r: 8px;
      --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Bebas Neue", sans-serif;
    }

    @font-face {
      font-family: "Bebas Neue";
      src: url("./logbook/fonts/BebasNeue-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root[data-theme="light"] {
      --color-bg:          #f5f5f5;
      --color-surface:     #ffffff;
      --color-text:        #1a1a1a;
      --color-text-muted:  #6b6b6b;
      --color-accent:      #ff2727;
      --color-accent-text: #ffffff;
      --color-border:      #dcdcdc;
    }
  </style>
  <script>
    (function () {
      var stored = localStorage.getItem("logbook_theme");
      var theme = stored || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body class="bg-background text-foreground font-sans min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-[440px] text-center">
    <h1 class="font-display text-5xl mb-4 tracking-wide">Climbing Logbook</h1>
    <p class="text-muted mb-8">
      Track your boulder and lead sends and projects, by grade and by
      place. Works offline, installable as a PWA. Share a read-only view
      of your log with a public profile page if you want to.
    </p>

    <div class="flex flex-col gap-3 mb-8">
      <a class="admin-btn admin-btn-primary" href="./register/">Sign up</a>
      <a class="admin-btn" href="./login/">Log in</a>
    </div>

    <!-- Closed beta (#296) -- registration needs a real invite code right
         now; this is a static page with no way to read BETA_GATE_ENABLED
         server-side, so the note stays regardless of that flag's current
         value, same reasoning as public/register/index.html's own invite
         code field always being shown. -->
    <p class="text-sm text-muted">
      Currently in a closed beta — signing up needs an invite code.
    </p>
  </div>
</body>
</html>
