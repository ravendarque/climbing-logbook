<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – Climbing Logbook</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../logbook/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../logbook/favicon-16.png">
  <meta name="theme-color" content="#ff2727">
  <!-- #470 -- starts the brand font fetch during initial parsing rather
       than waiting for layout to discover climbing-header.js's own
       @font-face rule -- see public/index.html's own comment for the
       fuller reasoning. Absolute /logbook/... here too, not ../logbook/...
       like the rest of this page's own asset paths -- the preload only
       helps if its URL matches climbing-header.js's own hardcoded
       @font-face url() byte-for-byte. -->
  <link rel="preload" as="font" type="font/woff2" href="/logbook/fonts/BebasNeue-Regular.woff2" crossorigin>
  <!-- Generated by `pnpm run tailwind:build` (see styles/tailwind.css) --
       not committed, see .gitignore. -->
  <link rel="stylesheet" href="../logbook/tailwind.css">
  <!-- Turnstile bot check (#311) -- loaded async since it's not needed
       for first paint. Explicit render (render=explicit + onload
       callback), not implicit auto-scan -- register.js needs to choose
       the sitekey at runtime (real vs. Cloudflare's test key, see its
       own comment for why), which implicit rendering's static
       data-sitekey attribute can't express. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
  <!-- Shared design tokens + <climbing-header> Custom Element (#345).
       Classic script, not a module -- must run synchronously here, before
       the [hidden]-dependent markup below and before first paint. See the
       file's own comment for why. -->
  <script src="../logbook/components/climbing-header.js"></script>
  <script>
    (function () {
      var stored = localStorage.getItem("logbook_theme");
      var theme = stored || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body class="bg-background text-foreground font-sans min-h-screen flex flex-col items-center justify-center gap-6 px-4">
  <climbing-header variant="brand"></climbing-header>
  <form class="w-full max-w-[360px] bg-surface border border-border rounded-app p-6" id="register-form" novalidate>
    <!-- Beta invite code (#296) -- always shown for now, since the gate
         is active; pre-filled from a `?code=` query param when an invite
         link supplies one (register.js). No client-side check for
         whether the gate is even on -- BETA_GATE_ENABLED is a server-side
         env var this static page can't see, and once the beta period
         ends this field just gets deleted along with flipping that flag,
         not hidden behind runtime logic for a state that's controlled by
         one config value. -->
    <label class="block text-sm text-muted mb-1" for="code">Invite code</label>
    <input
      class="bg-surface border border-border rounded-app px-[.85rem] py-[.65rem] text-foreground text-[1rem] outline-none focus:border-accent w-full mb-4"
      type="text" id="code" name="code" autocomplete="off">

    <label class="block text-sm text-muted mb-1" for="email">Email</label>
    <input
      class="bg-surface border border-border rounded-app px-[.85rem] py-[.65rem] text-foreground text-[1rem] outline-none focus:border-accent w-full mb-4"
      type="email" id="email" name="email" required autocomplete="email">

    <label class="block text-sm text-muted mb-1" for="username">Username</label>
    <input
      class="bg-surface border border-border rounded-app px-[.85rem] py-[.65rem] text-foreground text-[1rem] outline-none focus:border-accent w-full mb-1"
      type="text" id="username" name="username" required autocomplete="username"
      pattern="[a-z0-9._]+" minlength="1" maxlength="30"
      title="Lowercase letters, numbers, periods, and underscores only">
    <!-- Matches server/lib/auth.js's usernameValidator/min-maxUsernameLength
         exactly -- this is a client-side hint (nicer inline browser
         validation UX), the server-side check is the real enforcement.
         Same charset/length as Instagram (#341), since a username is
         also a literal URL path segment (#113,
         my.climbinglogbook.com/:username). -->
    <p class="text-xs text-muted mb-4">Lowercase letters, numbers, periods, and underscores only.</p>

    <label class="block text-sm text-muted mb-1" for="password">Password</label>
    <input
      class="bg-surface border border-border rounded-app px-[.85rem] py-[.65rem] text-foreground text-[1rem] outline-none focus:border-accent w-full mb-4"
      type="password" id="password" name="password" required autocomplete="new-password">

    <!-- Turnstile bot check (#311) -- rendered explicitly by register.js
         (see its own comment for why: the real widget's sitekey only
         works on ravendarque.com, so which sitekey to use is a runtime
         decision, not a static attribute here). -->
    <div id="turnstile-widget" class="mb-4"></div>

    <p class="text-sm text-accent mb-4" id="register-error" hidden></p>

    <button type="submit" class="w-full bg-accent text-accent-foreground border-none rounded-app py-[.9rem] text-[1rem] font-bold cursor-pointer disabled:opacity-[.45] disabled:cursor-not-allowed" id="register-submit-btn">Sign up</button>

    <p class="text-sm text-muted mt-4 text-center">
      Already have an account? <a class="text-accent" href="../login/">Log in</a>
    </p>
  </form>

  <!-- Post-signup state (#308's requireEmailVerification -- sign-up
       doesn't return a session, so this can't just redirect into the
       app the way login.js does). Same element swap pattern as the
       #loading/#app swap in the main app. -->
  <div class="w-full max-w-[360px] bg-surface border border-border rounded-app p-6 text-center" id="register-success" hidden>
    <h1 class="font-display text-3xl mb-4 tracking-wide">Check your email</h1>
    <p class="text-muted">We've sent a verification link to <strong id="register-success-email"></strong>. Click it to activate your account and sign in.</p>
  </div>

  <script type="module" src="./register.js"></script>
</body>
</html>
