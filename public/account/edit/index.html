<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit account details – Climbing Logbook</title>
  <link rel="manifest" href="/logbook/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/logbook/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/logbook/favicon-16.png">
  <link rel="apple-touch-icon" href="/logbook/apple-touch-icon.png">
  <meta name="theme-color" content="#ff2727">
  <!-- Genuinely static shell (#348), same pattern as public/account/index.html
       -- see that file's own comment for why every path below is absolute
       and client/account-edit-main.js reads the username from
       location.pathname itself rather than this file being templated. -->
  <link rel="stylesheet" href="/logbook/tailwind.css">
  <script src="/logbook/components/climbing-header.js"></script>
  <script>
    (function () {
      var stored = localStorage.getItem("logbook_theme");
      var theme = stored || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body class="bg-background text-foreground font-sans px-4 pt-6 pb-16 min-w-[300px]">
<div class="max-w-[960px] mx-auto">
  <div class="flex items-center justify-end gap-2 mb-6" id="header-row">
    <climbing-menu-bar no-discipline></climbing-menu-bar>
  </div>

  <climbing-header variant="brand" align-left></climbing-header>
  <climbing-tab-bar></climbing-tab-bar>

  <a class="inline-flex items-center gap-1 text-[.85rem] font-semibold text-muted hover:text-foreground mb-5" id="back-to-account-link" href="#">
    <svg class="w-[.9rem] h-[.9rem] stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    Back to my account
  </a>

  <p class="text-[.78rem] text-muted uppercase tracking-wide font-semibold mb-3">Edit account details</p>

  <!-- Three independently-submittable rows, each its own request against
       Better Auth's own update-user/change-password/change-email
       endpoints -- deliberately NOT one combined form. Raven's own call,
       2026-08-11: resubmitting fields you didn't touch (e.g. re-sending
       your current password just because you changed your username)
       reads as risky even when it's actually harmless, and there's no
       real need for it here -- these three endpoints already don't
       depend on each other server-side, so the UI shouldn't invent a
       dependency between them either. -->
  <div class="max-w-[420px] flex flex-col" id="account-fields">

    <div class="border-b border-border py-4" id="username-row">
      <div class="flex items-center justify-between gap-3" id="username-view">
        <div>
          <div class="text-[.72rem] text-muted font-semibold uppercase tracking-wide">Username</div>
          <div class="text-[.9rem] text-foreground font-semibold mt-0.5" id="username-value"></div>
        </div>
        <button type="button" class="admin-btn" id="username-edit-btn">Edit</button>
      </div>
      <form class="mt-2" id="username-form" hidden>
        <label class="text-[.72rem] text-muted font-semibold uppercase tracking-wide" for="username-input">Username</label>
        <input class="w-full mt-1 mb-2 bg-background border border-border rounded-app px-3 py-2 text-foreground text-[.9rem]" id="username-input" name="username" type="text" required>
        <p class="text-[.85rem] text-accent mb-2" id="username-error" hidden></p>
        <div class="flex gap-2">
          <button type="submit" class="admin-btn admin-btn-primary" id="username-save-btn">Save</button>
          <button type="button" class="admin-btn" id="username-cancel-btn">Cancel</button>
        </div>
      </form>
    </div>

    <div class="border-b border-border py-4" id="email-row">
      <div class="flex items-center justify-between gap-3" id="email-view">
        <div>
          <div class="text-[.72rem] text-muted font-semibold uppercase tracking-wide">Email</div>
          <div class="text-[.9rem] text-foreground font-semibold mt-0.5" id="email-value"></div>
        </div>
        <button type="button" class="admin-btn" id="email-edit-btn">Edit</button>
      </div>
      <form class="mt-2" id="email-form" hidden>
        <label class="text-[.72rem] text-muted font-semibold uppercase tracking-wide" for="email-input">Email</label>
        <input class="w-full mt-1 mb-2 bg-background border border-border rounded-app px-3 py-2 text-foreground text-[.9rem]" id="email-input" name="email" type="email" required>
        <p class="text-[.85rem] text-accent mb-2" id="email-error" hidden></p>
        <div class="flex gap-2">
          <button type="submit" class="admin-btn admin-btn-primary" id="email-save-btn">Save</button>
          <button type="button" class="admin-btn" id="email-cancel-btn">Cancel</button>
        </div>
      </form>
      <p class="text-[.82rem] text-foreground bg-surface border border-border rounded-app px-3 py-2 mt-2" id="email-pending" hidden></p>
    </div>

    <div class="py-4" id="password-row">
      <div class="flex items-center justify-between gap-3" id="password-view">
        <div>
          <div class="text-[.72rem] text-muted font-semibold uppercase tracking-wide">Password</div>
          <div class="text-[.9rem] text-foreground font-semibold mt-0.5">••••••••••</div>
        </div>
        <button type="button" class="admin-btn" id="password-edit-btn">Change</button>
      </div>
      <form class="mt-2" id="password-form" hidden>
        <label class="text-[.72rem] text-muted font-semibold uppercase tracking-wide" for="current-password-input">Current password</label>
        <input class="w-full mt-1 mb-2 bg-background border border-border rounded-app px-3 py-2 text-foreground text-[.9rem]" id="current-password-input" name="currentPassword" type="password" autocomplete="current-password" required>
        <label class="text-[.72rem] text-muted font-semibold uppercase tracking-wide" for="new-password-input">New password</label>
        <input class="w-full mt-1 mb-2 bg-background border border-border rounded-app px-3 py-2 text-foreground text-[.9rem]" id="new-password-input" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
        <p class="text-[.85rem] text-accent mb-2" id="password-error" hidden></p>
        <div class="flex gap-2">
          <button type="submit" class="admin-btn admin-btn-primary" id="password-save-btn">Save</button>
          <button type="button" class="admin-btn" id="password-cancel-btn">Cancel</button>
        </div>
      </form>
    </div>

  </div>

  <div class="text-center text-muted text-[.78rem] mt-8" id="footer"></div>
</div>

<script type="module" src="/logbook/account-edit-app.js"></script>
</body>
</html>
