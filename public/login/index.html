<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in – Climbing Logbook</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../logbook/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../logbook/favicon-16.png">
  <meta name="theme-color" content="#ff2727">
  <!-- Generated by `pnpm run tailwind:build` (see styles/tailwind.css) --
       not committed, see .gitignore. Same stylesheet the main app uses,
       so admin-btn/rounded-app/etc are already available here for free. -->
  <link rel="stylesheet" href="../logbook/tailwind.css">
  <!-- Shared design tokens + <climbing-header> Custom Element (#345).
       Classic script, not a module -- must run synchronously here, before
       the [hidden]-dependent markup below and before first paint. See the
       file's own comment for why. -->
  <script src="../logbook/components/climbing-header.js"></script>
  <script>
    // Same pre-paint theme bootstrap as public/logbook/index.html --
    // must run synchronously here, not deferred/module, or the browser
    // paints the wrong theme first and flashes.
    (function () {
      var stored = localStorage.getItem("logbook_theme");
      var theme = stored || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body class="bg-background text-foreground font-sans min-h-screen flex flex-col items-center justify-center gap-6 px-4">
  <climbing-header variant="brand"></climbing-header>
  <form class="w-full max-w-[360px] bg-surface border border-border rounded-app p-6" id="login-form" novalidate>
    <label class="block text-sm text-muted mb-1" for="email">Email</label>
    <input
      class="bg-surface border border-border rounded-app px-[.85rem] py-[.65rem] text-foreground text-[1rem] outline-none focus:border-accent w-full mb-4"
      type="email" id="email" name="email" required autocomplete="email">

    <label class="block text-sm text-muted mb-1" for="password">Password</label>
    <input
      class="bg-surface border border-border rounded-app px-[.85rem] py-[.65rem] text-foreground text-[1rem] outline-none focus:border-accent w-full mb-2"
      type="password" id="password" name="password" required autocomplete="current-password">

    <p class="text-sm text-right mb-4">
      <button type="button" class="text-accent bg-transparent border-0 p-0 cursor-pointer" id="forgot-password-btn">Forgot password?</button>
    </p>

    <p class="text-sm text-accent mb-4" id="login-error" hidden></p>
    <!-- Reused for both the "check your email" confirmation after
         forgot-password and any error from that same request -- they're
         mutually exclusive with #login-error/the form fields, never
         shown at the same time, see login.js. -->
    <p class="text-sm text-muted mb-4" id="login-info" hidden></p>

    <button type="submit" class="admin-btn admin-btn-primary w-full" id="login-submit-btn">Log in</button>

    <p class="text-sm text-muted mt-4 text-center">
      Don't have an account? <a class="text-accent" href="../register/">Sign up</a>
    </p>
  </form>
  <script type="module" src="./login.js"></script>
</body>
</html>
