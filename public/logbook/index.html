<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climbing Logbook</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ff2727">
  <!-- Generated by `pnpm run tailwind:build`/`tailwind:watch` (see styles/tailwind.css) —
       not committed, see .gitignore. The box-sizing/margin/padding reset lives in
       styles/tailwind.css's @layer base now (see #51) — it has to be inside
       Tailwind's layer system, not this plain <style> block, or every margin/
       padding utility Tailwind generates gets silently overridden (unlayered CSS
       always beats layered CSS regardless of specificity or source order). -->
  <link rel="stylesheet" href="./tailwind.css">
  <style>
    /* ── Base (standalone — no shared theme engine) ─────────────────── */
    :root {
      --color-bg:          #0f0f0f;
      --color-surface:     #1a1a1a;
      --color-text:        #f0f0f0;
      --color-text-muted:  #a0a0a0;
      --color-accent:      #ff2727;
      --color-accent-text: #ffffff;
      --color-border:      #2e2e2e;
      --r: 8px;
      --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Deliberately unlayered (not in styles/tailwind.css's @layer base),
       same reasoning as the :root tokens above: the browser's UA
       stylesheet sets `[hidden] { display: none }`, but any normal-origin
       author declaration beats a normal-origin UA declaration regardless
       of specificity — so a plain `flex`/`inline-flex` utility class (or
       admin-btn's own `display: inline-flex`) silently wins over `hidden`
       on its own. Putting the override in @layer base wouldn't fix this
       either, since utilities is a later layer and always beats base
       regardless of specificity (the same bug class #51 hit with
       `margin: 0`) — it has to be unlayered to beat both. This is the one
       piece of Tailwind's preflight (which this app doesn't import) that
       every hidden-attribute element actually needs. */
    [hidden] { display: none; }

    /* ── Grade colours — semantic ─────────────────────────────────── */
    :root {
      --grade-easy:  #94a3b8;
      --grade-6a:    #22d3ee;
      --grade-6b:    #4ade80;
      --grade-6c:    #a3e635;
      --grade-7a:    #facc15;
      --grade-7b:    #fb923c;
      --grade-7c:    #f87171;
      --grade-8a:    #c084fc;
      --field-h:     2.25rem;
    }
  </style>
</head>

            <button type="button" class="toggle-btn bg-surface text-muted text-[.78rem] font-semibold cursor-pointer whitespace-nowrap transition-colors duration-150 hover:text-foreground [&.active]:bg-accent [&.active]:text-accent-foreground w-full flex flex-row items-center justify-start gap-[.6rem] px-[.7rem] py-[.55rem] text-left border-b border-border last:border-b-0" data-filter="project">

            <button type="button" class="toggle-btn bg-surface text-muted text-[.78rem] font-semibold cursor-pointer whitespace-nowrap transition-colors duration-150 hover:text-foreground [&.active]:bg-accent [&.active]:text-accent-foreground w-full flex flex-row items-center justify-start gap-[.6rem] px-[.7rem] py-[.55rem] text-left border-b border-border last:border-b-0" data-filter="wishlist">

<!-- ══ Add / edit entry modal ════════════════════════════════════════ -->
<div class="fixed inset-0 z-[100] bg-[color-mix(in_srgb,black_60%,transparent)] flex items-start justify-center px-4 py-6 overflow-y-auto" id="entry-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="entry-modal-title">

    </div>

    <form id="entry-form" autocomplete="off">

        <input type="text" class="bg-surface border border-border rounded-app px-[.85rem] py-[.65rem] text-foreground text-[1rem] outline-none focus:border-accent w-full" id="entry-name" required>
      </div>

      <div class="flex flex-wrap gap-[.6rem] mb-3">
        <div class="flex-1 min-w-0">
          <div class="text-[.72rem] font-semibold uppercase tracking-[.07em] text-muted mb-2">Location</div>
          <input type="text" class="bg-surface border border-border rounded-app px-[.85rem] py-[.65rem] text-foreground text-[1rem] outline-none focus:border-accent w-full" id="entry-place" list="entry-places-list" required>
          <datalist id="entry-places-list"></datalist>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-[.72rem] font-semibold uppercase tracking-[.07em] text-muted mb-2">Area</div>
          <input type="text" class="bg-surface border border-border rounded-app px-[.85rem] py-[.65rem] text-foreground text-[1rem] outline-none focus:border-accent w-full" id="entry-area" list="entry-areas-list">
          <datalist id="entry-areas-list"></datalist>
        </div>
      </div>

      <div class="text-[.72rem] font-semibold uppercase tracking-[.07em] text-muted mb-2 mt-[1.1rem]">Grade</div>
      <div class="flex flex-wrap gap-[.6rem] mb-3">
        <div class="flex-[1_1_9rem] min-w-0 h-[var(--field-h)] flex items-stretch gap-2">

            <svg class="w-[.8rem] h-[.8rem] fill-current" viewBox="0 0 24 24"><polygon points="16 5 6 12 16 19"></polygon></svg>
          </button>
          <select class="grade-select flex-1 min-w-0 h-[var(--field-h)]" id="grade-select"></select>
          <button type="button" class="flex-[0_0_var(--field-h)] flex items-center justify-center border border-border rounded-app bg-surface text-foreground cursor-pointer hover:border-accent active:scale-[.94]" id="grade-next" aria-label="Next grade">
            <svg class="w-[.8rem] h-[.8rem] fill-current" viewBox="0 0 24 24"><polygon points="8 5 18 12 8 19"></polygon></svg>
          </button>
        </div>
        <div class="border border-border rounded-app overflow-hidden flex flex-[1_1_9rem] min-w-0 h-[var(--field-h)]" id="type-group">
          <button type="button" class="toggle-btn bg-surface text-muted text-[.78rem] font-semibold cursor-pointer whitespace-nowrap transition-colors duration-150 hover:text-foreground [&.active]:bg-accent [&.active]:text-accent-foreground flex-1 min-w-16 h-full flex items-center justify-center text-center px-[.6rem] py-2 border-r border-border last:border-r-0 active" data-value="boulder">Boulder</button>
          <button type="button" class="toggle-btn bg-surface text-muted text-[.78rem] font-semibold cursor-pointer whitespace-nowrap transition-colors duration-150 hover:text-foreground [&.active]:bg-accent [&.active]:text-accent-foreground flex-1 min-w-16 h-full flex items-center justify-center text-center px-[.6rem] py-2 border-r border-border last:border-r-0" data-value="lead">Lead</button>

      <div class="text-[.72rem] font-semibold uppercase tracking-[.07em] text-muted mb-2 mt-[1.1rem]">Status</div>
      <div class="border border-border rounded-app overflow-hidden inline-flex flex-nowrap w-auto mb-3" id="status-group">
        <button type="button" class="toggle-btn bg-surface text-muted text-[.78rem] font-semibold cursor-pointer whitespace-nowrap transition-colors duration-150 hover:text-foreground [&.active]:bg-accent [&.active]:text-accent-foreground flex-none min-w-[4.5rem] flex flex-col items-center justify-center gap-[.15rem] px-[.3rem] py-[.45rem] border-r border-border last:border-r-0" data-value="flash">

          <button type="button" class="flex-[0_0_2.75rem] flex items-center justify-center border border-border rounded-app bg-surface text-foreground cursor-pointer hover:border-accent" id="date-picker-btn" aria-label="Pick a date">

        <div class="text-[.75rem] text-muted mt-[.3rem]">YYYY-MM or YYYY-MM-DD</div>

      <div class="text-[.72rem] font-semibold uppercase tracking-[.07em] text-muted mb-2 mt-[1.1rem]">Notes</div>
      <div class="mb-3">
        <textarea class="bg-surface border border-border rounded-app px-[.85rem] py-[.65rem] text-foreground text-[1rem] outline-none focus:border-accent w-full resize-y min-h-[72px]" id="entry-notes"></textarea>

  };

  // ── Grade ordering (display) ─────────────────────────────────────────
  const GRADE_ORDER = [
    "3","3+","4","4+","5","5+","5A","5A+","5B","5B+","5C",
    "6A","6A+","6B","6B+","6C","6C+",
    "7A","7A+","7B","7B+","7C","7C+",
    "8A","8A+","8B","8B+","8C","8C+",
    "9A","9A+"
  ];
  const GRADE_RANK = Object.fromEntries(GRADE_ORDER.map((g, i) => [g.toUpperCase(), i]));
  function gradeRank(g) { return GRADE_RANK[g.toUpperCase()] ?? 99; }

  function gradeColor(g) {
    const r = gradeRank(g);
    if (r < 5)  return "var(--grade-easy)";
    if (r < 8)  return "var(--grade-6a)";
    if (r < 10) return "var(--grade-6b)";
    if (r < 12) return "var(--grade-6c)";
    if (r < 14) return "var(--grade-7a)";
    if (r < 16) return "var(--grade-7b)";
    if (r < 18) return "var(--grade-7c)";
    return "var(--grade-8a)";
  }

  // ── Grade data (entry form) ───────────────────────────────────────────
  const BOULDER_GRADES = [
    { g: "5+",  v: "V0",  c: "var(--grade-easy)" },
    { g: "5A",  v: "V0",  c: "var(--grade-easy)" },
    { g: "5B",  v: "V1",  c: "var(--grade-easy)" },
    { g: "5C",  v: "V2",  c: "var(--grade-easy)" },
    { g: "6A",  v: "V3",  c: "var(--grade-6a)"   },
    { g: "6A+", v: "V3",  c: "var(--grade-6a)"   },
    { g: "6B",  v: "V4",  c: "var(--grade-6b)"   },
    { g: "6B+", v: "V4",  c: "var(--grade-6b)"   },
    { g: "6C",  v: "V5",  c: "var(--grade-6c)"   },
    { g: "6C+", v: "V5",  c: "var(--grade-6c)"   },
    { g: "7A",  v: "V6",  c: "var(--grade-7a)"   },
    { g: "7A+", v: "V7",  c: "var(--grade-7a)"   },
    { g: "7B",  v: "V8",  c: "var(--grade-7b)"   },
    { g: "7B+", v: "V8",  c: "var(--grade-7b)"   },
    { g: "7C",  v: "V9",  c: "var(--grade-7c)"   },
    { g: "7C+", v: "V10", c: "var(--grade-7c)"   },
    { g: "8A",  v: "V11", c: "var(--grade-8a)"   },
    { g: "8A+", v: "V12", c: "var(--grade-8a)"   },
    { g: "8B",  v: "V13", c: "var(--grade-8a)"   },
    { g: "8B+", v: "V14", c: "var(--grade-8a)"   },
  ];
  const LEAD_GRADES = [
    { g: "5c",  c: "var(--grade-easy)" },
    { g: "6a",  c: "var(--grade-6a)"   },
    { g: "6a+", c: "var(--grade-6a)"   },
    { g: "6b",  c: "var(--grade-6b)"   },
    { g: "6b+", c: "var(--grade-6b)"   },
    { g: "6c",  c: "var(--grade-6c)"   },
    { g: "6c+", c: "var(--grade-6c)"   },
    { g: "7a",  c: "var(--grade-7a)"   },
    { g: "7a+", c: "var(--grade-7a)"   },
    { g: "7b",  c: "var(--grade-7b)"   },
    { g: "7b+", c: "var(--grade-7b)"   },
    { g: "7c",  c: "var(--grade-7c)"   },
    { g: "7c+", c: "var(--grade-7c)"   },
    { g: "8a",  c: "var(--grade-8a)"   },
  ];

  // ── Date helpers ─────────────────────────────────────────────────────
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function formatDate(d) {
    if (!d) return "—";
    const p = d.split("-");
    if (p.length === 1) return p[0];
    if (p.length === 2) return `${MONTHS[+p[1]-1]} ${p[0]}`;
    return `${+p[2]} ${MONTHS[+p[1]-1]} ${p[0]}`;
  }
  function dateRank(d) {
    if (!d) return -1;
    return new Date(d).getTime();
  }

  // ── Status ───────────────────────────────────────────────────────────
  const STATUS_ICON_CLASS = "inline-flex align-middle cursor-default [&_svg]:w-[1.4rem] [&_svg]:h-[1.4rem]";
  function statusBadge(entry) {
    if (entry.status === "send" && entry.flash)
      return `<span class="${STATUS_ICON_CLASS}" title="Flash">${STATUS_ICONS.flash}</span>`;
    if (entry.status === "send")
      return `<span class="${STATUS_ICON_CLASS}" title="Send">${STATUS_ICONS.send}</span>`;
    if (entry.status === "project")
      return `<span class="${STATUS_ICON_CLASS}" title="Project">${STATUS_ICONS.project}</span>`;
    if (entry.status === "abandoned")
      return `<span class="${STATUS_ICON_CLASS}" title="Abandoned">${STATUS_ICONS.abandoned}</span>`;
    return `<span class="${STATUS_ICON_CLASS}" title="Check out">${STATUS_ICONS.wishlist}</span>`;
  }

  // ── State ────────────────────────────────────────────────────────────
  const state = {
    statusFilters: new Set(), // empty = "all"
    typeFilters: new Set(),   // empty = "all"
    search: "",
    sortByPlace: {},  // { placeName: { col: "grade", dir: "asc" } }
    collapsed: new Set(),
  };

  function getSort(place) {
    return state.sortByPlace[place] ?? { col: "grade", dir: "asc" };
  }

  let ALL_ENTRIES  = [];
  let isLoggedIn   = false;
  let athleteMode  = false;
  let editingId    = null; // null = add mode

  // ── Offline queue ──────────────────────────────────────────────────
  function getQueue() {
    try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) ?? []; }
    catch { return []; }
  }
  function setQueue(queue) {
    localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
    updateSyncButton();
  }
  function applyPendingToEntries() {
    for (const item of getQueue()) {
      if (item.op === "add") {
        if (!ALL_ENTRIES.some(e => e.id === item.entry.id)) {
          ALL_ENTRIES.push({ ...item.entry, _pending: true });
        }
      } else if (item.op === "delete") {
        ALL_ENTRIES = ALL_ENTRIES.filter(e => e.id !== item.entry.id);
      } else {
        const idx = ALL_ENTRIES.findIndex(e => e.id === item.entry.id);
        if (idx !== -1) ALL_ENTRIES[idx] = { ...item.entry, _pending: true };
      }
    }
  }
  function updateSyncButton() {
    const n = getQueue().length;
    syncBtn.hidden = n === 0;
    syncBtnLabel.textContent = n ? `Sync (${n})` : "Sync";
  }

  async function syncPending() {
    const queue = getQueue();
    if (!queue.length) return;
    syncBtn.disabled = true;

    const remaining = [];
    let lastEntries = null;
    for (const item of queue) {
      try {
        const res = item.op === "delete"
          ? await fetch(`${ADMIN_DATA_URL}?id=${encodeURIComponent(item.entry.id)}`, { method: "DELETE" })
          : await fetch(ADMIN_DATA_URL, {
              method: item.op === "edit" ? "PUT" : "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(item.entry),
            });
        if (res.status === 401) {
          remaining.push(item);
          isLoggedIn = false;
          updateAdminBar();
          break;
        }
        if (!res.ok) { remaining.push(item); continue; }
        const data = await res.json();
        lastEntries = data.entries;
      } catch {
        remaining.push(item);
        break; // still offline — stop, preserve order for next attempt
      }
    }

    setQueue(remaining);
    if (lastEntries) {
      ALL_ENTRIES = lastEntries;
      localStorage.setItem(ENTRIES_CACHE_KEY, JSON.stringify(ALL_ENTRIES));
      applyPendingToEntries();
    }
    syncBtn.disabled = false;
    render();
  }

  // ── Data ─────────────────────────────────────────────────────────────
  function entryMatchesStatusFilter(entry, filter) {
    if (filter === "flash") return entry.status === "send" && entry.flash;
    if (filter === "send")  return entry.status === "send" && !entry.flash;
    return entry.status === filter;
  }

  function filteredEntries() {
    const q = state.search.toLowerCase();
    return ALL_ENTRIES.filter(e => {
      if (state.statusFilters.size > 0 &&
          ![...state.statusFilters].some(f => entryMatchesStatusFilter(e, f))) return false;
      if (state.typeFilters.size > 0 && !state.typeFilters.has(e.type)) return false;
      if (q && !e.name.toLowerCase().includes(q) && !(e.area||"").toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function groupByPlace(entries) {
    const map = new Map();
    for (const e of entries) {
      if (!map.has(e.place)) map.set(e.place, []);
      map.get(e.place).push(e);
    }
    // Preserve order from original data
    const placeOrder = [...new Set(ALL_ENTRIES.map(e => e.place))];
    return placeOrder
      .filter(p => map.has(p))
      .map(p => [p, map.get(p)]);
  }

  function sortEntries(entries, place) {
    const { col, dir } = getSort(place);
    const m = dir === "asc" ? 1 : -1;
    return [...entries].sort((a, b) => {
      if (col === "grade")  return m * (gradeRank(a.grade) - gradeRank(b.grade));
      if (col === "date")   return m * (dateRank(a.date) - dateRank(b.date));
      if (col === "name")   return m * a.name.localeCompare(b.name);
      return 0;
    });
  }

  // ── Render ───────────────────────────────────────────────────────────
  function updateFilterUI() {
    document.querySelectorAll("#type-toggle .type-btn").forEach(b => {
      const active = state.typeFilters.has(b.dataset.type);
      b.classList.toggle("active", active);
      b.setAttribute("aria-pressed", String(active));
    });
    document.querySelectorAll("#filter-status-group .toggle-btn").forEach(b => {
      const active = state.statusFilters.has(b.dataset.filter);
      b.classList.toggle("active", active);
      b.setAttribute("aria-pressed", String(active));
    });
    const hasFilters = state.typeFilters.size > 0 || state.statusFilters.size > 0;
    filterBtn.classList.toggle("active", hasFilters);
  }

  const EDIT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"></path></svg>`;

  // ── Table cell/header base styles — shared across every place-section's
  // table, so defined once rather than repeated per column ──────────────
  const TH_BASE = "text-left px-[.65rem] py-[.35rem] text-muted font-medium text-[.72rem] uppercase tracking-wider border-b border-border whitespace-nowrap";
  const TH_SORTABLE = "cursor-pointer hover:text-foreground";
  const TD_BASE = "px-[.65rem] py-[.35rem] align-middle";

  function renderSections(entries) {
    const container = document.getElementById("sections");
    const groups = groupByPlace(entries);

    if (groups.length === 0) {
      container.innerHTML = `<div class="bg-surface border border-border rounded-app px-5 py-4 text-muted text-center">No problems match your filters.</div>`;
      return;
    }

    let idx = 0;
    container.innerHTML = groups.map(([place, items]) => {
      idx++;
      const sorted = sortEntries(items, place);
      const { col, dir } = getSort(place);
      const isCollapsed = state.collapsed.has(place);

      const sortIcon = (c) => c !== col
        ? `<i class="ml-[.3rem] not-italic opacity-40">↕</i>`
        : `<i class="ml-[.3rem] not-italic opacity-100 text-accent">${dir === "asc" ? "↑" : "↓"}</i>`;
      const sortAria = (c) => c !== col ? "none" : (dir === "asc" ? "ascending" : "descending");

      const rows = sorted.map(e => {
        const rowBg = e._pending
          ? "bg-[color-mix(in_srgb,var(--color-accent)_6%,var(--color-surface))]"
          : "hover:bg-[color-mix(in_srgb,var(--color-accent)_4%,var(--color-surface))]";
        return `
        <tr class="border-b border-[color-mix(in_srgb,var(--color-border)_40%,transparent)] last:border-b-0 ${rowBg}">
          <td class="${TD_BASE} text-center w-8">${statusBadge(e)}</td>
          <td class="${TD_BASE}"><span class="grade-badge" style="color:${gradeColor(e.grade)}">${escapeHtml(e.grade)}</span></td>
          <td class="${TD_BASE}">
            <span class="font-medium">${escapeHtml(e.name)}</span>
            ${e.notes ? `<span class="cursor-help text-muted text-[.9rem]" title="${escapeHtml(e.notes)}"> ℹ</span>` : ""}
            ${e._pending ? `<span class="text-[.68rem] font-bold text-accent whitespace-nowrap"> · pending sync</span>` : ""}
          </td>
          <td class="${TD_BASE} text-muted text-[.82rem]">${escapeHtml(e.area)}</td>
          <td class="${TD_BASE} text-muted text-[.82rem]">${escapeHtml(e.type)}</td>
          <td class="${TD_BASE} text-muted text-[.82rem] whitespace-nowrap">${formatDate(e.date)}</td>
          <td class="${TD_BASE} text-center w-8">${e.video ? `<a class="inline-flex items-center gap-[.2rem] text-accent text-[.8rem] no-underline hover:opacity-75" href="${escapeHtml(e.video)}" target="_blank" rel="noopener" title="Watch video">▶</a>` : ""}</td>
          <td class="${TD_BASE} text-center w-8">${isLoggedIn ? `<button type="button" class="edit-btn border-0 bg-transparent cursor-pointer text-muted inline-flex p-[.2rem] hover:text-accent [&_svg]:w-[.95rem] [&_svg]:h-[.95rem] [&_svg]:stroke-current [&_svg]:fill-none" data-edit-id="${escapeHtml(e.id)}" aria-label="Edit">${EDIT_ICON}</button>` : ""}</td>
        </tr>
      `;
      }).join("");

      return `
        <div class="bg-surface border border-border rounded-app mb-3 overflow-hidden" data-place="${escapeHtml(place)}">
          <div class="place-header flex items-center gap-[.6rem] px-[.9rem] py-[.6rem] border-b border-border bg-[color-mix(in_srgb,var(--color-surface)_60%,var(--color-bg))] cursor-pointer select-none hover:bg-[color-mix(in_srgb,var(--color-accent)_6%,var(--color-surface))]" data-place="${escapeHtml(place)}" role="button" tabindex="0" aria-expanded="${!isCollapsed}">
            <span class="font-semibold text-base flex-1">${escapeHtml(place)}</span>
            <span class="text-muted text-[.8rem] whitespace-nowrap">${sorted.length} ${sorted.length === 1 ? "entry" : "entries"}</span>
            <span class="text-muted text-[.8rem] flex gap-3 max-[600px]:hidden">
              ${PLACE_COUNTRY[place] ? `<span>${escapeHtml(PLACE_COUNTRY[place])}</span>` : ""}
            </span>
            <span class="text-muted text-[.8rem] transition-transform duration-200 ${isCollapsed ? "-rotate-90" : ""}">▾</span>
          </div>
          <div class="overflow-x-auto ${isCollapsed ? "hidden" : ""}">
            <table class="w-full border-collapse text-[.88rem] min-w-[520px]">
              <thead>
                <tr>
                  <th class="${TH_BASE} w-8"></th>
                  <th class="${TH_BASE} ${TH_SORTABLE}" data-sort="grade" data-place="${escapeHtml(place)}" role="button" tabindex="0" aria-sort="${sortAria("grade")}">
                    Grade ${sortIcon("grade")}
                  </th>
                  <th class="${TH_BASE} ${TH_SORTABLE}" data-sort="name" data-place="${escapeHtml(place)}" role="button" tabindex="0" aria-sort="${sortAria("name")}">
                    Name ${sortIcon("name")}
                  </th>
                  <th class="${TH_BASE}">Area</th>
                  <th class="${TH_BASE}">Type</th>
                  <th class="${TH_BASE} ${TH_SORTABLE}" data-sort="date" data-place="${escapeHtml(place)}" role="button" tabindex="0" aria-sort="${sortAria("date")}">
                    Date ${sortIcon("date")}
                  </th>
                  <th class="${TH_BASE} w-8"></th>
                  <th class="${TH_BASE} w-8"></th>
                </tr>
              </thead>
              <tbody>
                ${rows || `<tr><td class="text-center text-muted p-8 text-[.9rem]" colspan="8">No problems match.</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>`;
    }).join("");
  }

  function render() {
    const entries = filteredEntries();
    updateFilterUI();
    renderSections(entries);
    updateSubtitle(entries);
    updateAdminBar();
    updateCollapseAllBtn(entries);
  }

  function updateCollapseAllBtn(entries) {
    const places = groupByPlace(entries).map(([place]) => place);
    const allCollapsed = places.length > 0 && places.every(p => state.collapsed.has(p));
    collapseAllBtn.textContent = allCollapsed ? "Expand all" : "Collapse all";
  }

  function updateSubtitle(entries) {
    const sends  = ALL_ENTRIES.filter(e => e.status === "send").length;
    const places = new Set(ALL_ENTRIES.map(e => e.place)).size;
    document.getElementById("subtitle").textContent =
      `${ALL_ENTRIES.length} problems · ${sends} sent · ${places} destinations`;
    document.getElementById("footer").textContent = "";
  }

  // ── DOM refs ─────────────────────────────────────────────────────────
  const loginToggleBtn = document.getElementById("login-toggle-btn");
  const athleteModeBtn = document.getElementById("athlete-mode-btn");
  const addBtn      = document.getElementById("add-btn");
  const syncBtn     = document.getElementById("sync-btn");
  const syncBtnLabel = document.getElementById("sync-btn-label");
  const filterBtn    = document.getElementById("filter-btn");
  const filterPanel  = document.getElementById("filter-panel");
  const filterClearBtn = document.getElementById("filter-clear-btn");
  const collapseAllBtn = document.getElementById("collapse-all-btn");

  const entryOverlay   = document.getElementById("entry-overlay");
  const entryForm      = document.getElementById("entry-form");
  const entryModalTitle= document.getElementById("entry-modal-title");
  const nameInput  = document.getElementById("entry-name");
  const placeInput = document.getElementById("entry-place");
  const areaInput  = document.getElementById("entry-area");
  const notesInput = document.getElementById("entry-notes");
  const videoInput = document.getElementById("entry-video");
  const gradeSelect = document.getElementById("grade-select");
  const gradePrev   = document.getElementById("grade-prev");
  const gradeNext   = document.getElementById("grade-next");
  const dateInput  = document.getElementById("entry-date");
  const dateNative = document.getElementById("date-native");
  const datePickerBtn = document.getElementById("date-picker-btn");
  const entrySubmitBtn = document.getElementById("entry-submit-btn");
  const entryDeleteBtn = document.getElementById("entry-delete-btn");
  const entryMsg      = document.getElementById("entry-msg");

  // ── Admin bar ────────────────────────────────────────────────────────
  function updateAdminBar() {
    loginToggleBtn.textContent = isLoggedIn ? "Log out" : "Log in";
    addBtn.hidden = !isLoggedIn;
    athleteModeBtn.hidden = !isLoggedIn;
    athleteModeBtn.setAttribute("aria-checked", String(athleteMode));
    updateSyncButton();
  }

  // Public visitors always see the effective setting (Off by default,
  // absent KV key); only the logged-in admin sees a control to change it.
  async function fetchAthleteMode() {
    try {
      const res = await fetch(SETTINGS_URL);
      const data = await res.json();
      athleteMode = res.ok && !!data.athleteMode;
    } catch {
      // Offline — keep the last-known in-memory default (false) rather
      // than guessing; the toggle itself is only interactive when logged
      // in, so a stale value here can't be acted on incorrectly.
    }
  }

  athleteModeBtn.addEventListener("click", async () => {
    const next = !athleteMode;
    athleteModeBtn.disabled = true;
    try {
      const res = await fetch(ADMIN_SETTINGS_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ athleteMode: next }),
      });
      if (res.status === 401) {
        // Access session lapsed since page load — same handling as
        // syncPending()'s 401 case: drop back to the logged-out view.
        isLoggedIn = false;
      } else if (res.ok) {
        const data = await res.json();
        athleteMode = !!data.athleteMode;
        athleteModeBtn.title = "";
      } else {
        athleteModeBtn.title = `Failed to update Athlete Mode (${res.status})`;
      }
    } catch (err) {
      athleteModeBtn.title = `Failed to update Athlete Mode: ${err.message}`;
    } finally {
      athleteModeBtn.disabled = false;
      updateAdminBar();
    }
  });

  // Cloudflare Access gates /logbook/api/admin/* at Cloudflare's edge, so
  // "logged in" just means "the session fetch below wasn't intercepted by
  // Access's own hosted login page." A genuine network failure (offline)
  // is distinguished from "not authenticated" so the offline-queue hint
  // doesn't get mistaken for a real session.
  async function checkSession() {
    let res;
    try {
      res = await fetch(ADMIN_SESSION_URL);
    } catch {
      // Offline — fall back to the last known login state so the UI
      // still shows edit affordances; writes still get verified for
      // real by Access once synced.
      isLoggedIn = localStorage.getItem(LOGIN_HINT_KEY) === "1";
      return;
    }
    try {
      const data = await res.json();
      isLoggedIn = res.ok && !!data.loggedIn;
    } catch {
      // Access intercepted with its own hosted login page (non-JSON) —
      // not logged in.
      isLoggedIn = false;
    }
    localStorage.setItem(LOGIN_HINT_KEY, isLoggedIn ? "1" : "0");
  }

  loginToggleBtn.addEventListener("click", () => {
    if (isLoggedIn) {
      window.location.href = ACCESS_LOGOUT_URL;
    } else {
      // Full-page navigation (not fetch) so Cloudflare Access's hosted
      // login redirect can actually complete; it bounces back to the app
      // once you're authenticated.
      window.location.href = ADMIN_LOGIN_URL;
    }
  });

  syncBtn.addEventListener("click", syncPending);
  window.addEventListener("online", () => { if (isLoggedIn) syncPending(); });

  // ── Entry form: place/area lookup ───────────────────────────────────
  function populatePlaces() {
    const places = [...new Set(ALL_ENTRIES.map(e => e.place))].sort();
    document.getElementById("entry-places-list").innerHTML =
      places.map(p => `<option value="${escapeHtml(p)}">`).join("");
  }
  function populateAreas(place) {
    const areas = [...new Set(
      ALL_ENTRIES.filter(e => (!place || e.place === place) && e.area).map(e => e.area)
    )].sort();
    document.getElementById("entry-areas-list").innerHTML =
      areas.map(a => `<option value="${escapeHtml(a)}">`).join("");
  }
  // A known area implies its place — auto-fill Location from Area when
  // it exactly matches an area we've already logged somewhere.
  function findPlaceForArea(area) {
    const match = ALL_ENTRIES.find(e => (e.area || "").toLowerCase() === area.toLowerCase());
    return match?.place ?? null;
  }
  placeInput.addEventListener("input", () => populateAreas(placeInput.value.trim()));
  areaInput.addEventListener("focus", () => populateAreas(placeInput.value.trim()));
  areaInput.addEventListener("input", () => {
    const area = areaInput.value.trim();
    populateAreas(placeInput.value.trim());
    if (!placeInput.value.trim() && area) {
      const place = findPlaceForArea(area);
      if (place) placeInput.value = place;
    }
  });

  // ── Entry form: type toggle ─────────────────────────────────────────
  let selectedType = "boulder";
  document.getElementById("type-group").addEventListener("click", e => {
    const btn = e.target.closest(".toggle-btn");
    if (!btn) return;
    selectedType = btn.dataset.value;
    document.querySelectorAll("#type-group .toggle-btn").forEach(b =>
      b.classList.toggle("active", b === btn));
    renderGradeOptions();
    selectGradeByIndex(0);
  });

  // ── Entry form: grade picker (dropdown + prev/next) ──────────────────
  let selectedGrade = "";
  function currentGrades() {
    return selectedType === "boulder" ? BOULDER_GRADES : LEAD_GRADES;
  }
  function renderGradeOptions() {
    const boulder = selectedType === "boulder";
    gradeSelect.innerHTML = currentGrades()
      .map(({ g, v }) => `<option class="font-mono font-bold bg-surface text-foreground" value="${g}">${boulder ? `${g}/${v}` : g}</option>`)
      .join("");
  }
  function selectGradeByIndex(index) {
    const grades = currentGrades();
    const wrapped = ((index % grades.length) + grades.length) % grades.length;
    const { g, c } = grades[wrapped];
    selectedGrade = g;
    gradeSelect.value = g;
    gradeSelect.style.color = c;
  }
  function selectGradeByValue(value, type) {
    const grades = type === "boulder" ? BOULDER_GRADES : LEAD_GRADES;
    const idx = grades.findIndex(({ g }) => g.toUpperCase() === String(value).toUpperCase());
    selectGradeByIndex(idx === -1 ? 0 : idx);
  }
  function currentGradeIndex() {
    const idx = currentGrades().findIndex(({ g }) => g === selectedGrade);
    return idx === -1 ? 0 : idx;
  }
  gradeSelect.addEventListener("change", () => selectGradeByIndex(
    currentGrades().findIndex(({ g }) => g === gradeSelect.value)
  ));
  gradePrev.addEventListener("click", () => selectGradeByIndex(currentGradeIndex() - 1));
  gradeNext.addEventListener("click", () => selectGradeByIndex(currentGradeIndex() + 1));

  // ── Entry form: status toggle (Flash = status send, flash=true) ─────
  let selectedStatus = "send";
  let isFlash = false;
  document.getElementById("status-group").addEventListener("click", e => {
    const btn = e.target.closest(".toggle-btn");
    if (!btn) return;
    const value = btn.dataset.value;
    selectedStatus = value === "flash" ? "send" : value;
    isFlash = value === "flash";
    document.querySelectorAll("#status-group .toggle-btn").forEach(b =>
      b.classList.toggle("active", b === btn));
  });
  document.querySelectorAll("[data-icon]").forEach(el => {
    el.innerHTML = STATUS_ICONS[el.dataset.icon];
  });

  function setStatusToggle(status, flash) {
    const value = flash ? "flash" : status;
    document.querySelectorAll("#status-group .toggle-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.value === value));
    selectedStatus = status;
    isFlash = flash;
  }
  function setTypeToggle(type) {
    selectedType = type;
    document.querySelectorAll("#type-group .toggle-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.value === type));
    renderGradeOptions();
  }

  // ── Entry form: date picker ──────────────────────────────────────────
  datePickerBtn.addEventListener("click", () => {
    const current = dateInput.value.trim();
    dateNative.value = /^\d{4}-\d{2}-\d{2}$/.test(current)
      ? current
      : /^\d{4}-\d{2}$/.test(current)
        ? `${current}-01`
        : new Date().toISOString().slice(0, 10);
    if (dateNative.showPicker) dateNative.showPicker();
    else dateNative.focus();
  });
  dateNative.addEventListener("change", () => {
    if (dateNative.value) dateInput.value = dateNative.value;
  });

  // ── Modal helpers: focus trap + Escape-to-close ──────────────────────
  let lastFocusedEl = null;
  function focusableEls(overlay) {
    return [...overlay.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter(el => !el.disabled && el.offsetParent !== null);
  }
  function openModal(overlay) {
    lastFocusedEl = document.activeElement;
    overlay.hidden = false;
    overlay.scrollTop = 0;
  }
  function closeModal(overlay) {
    overlay.hidden = true;
    if (lastFocusedEl) lastFocusedEl.focus();
  }
  document.addEventListener("keydown", e => {
    const openOverlay = [entryOverlay].find(o => !o.hidden);
    if (!openOverlay) return;

    if (e.key === "Escape") {
      closeModal(openOverlay);
      return;
    }

    if (e.key === "Tab") {
      const focusable = focusableEls(openOverlay);
      if (focusable.length === 0) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  });

  // ── Entry modal: open/close ──────────────────────────────────────────
  function openEntryModal(entry) {
    editingId = entry?.id ?? null;
    entryModalTitle.textContent = editingId ? "Edit entry" : "Add entry";
    entrySubmitBtn.textContent = editingId ? "Save changes" : "Add to logbook";
    entryDeleteBtn.hidden = !editingId;
    entryMsg.className = "hidden";

    nameInput.value  = entry?.name  ?? "";
    placeInput.value = entry?.place ?? "";
    areaInput.value  = entry?.area  ?? "";
    notesInput.value = entry?.notes ?? "";
    videoInput.value = entry?.video ?? "";
    dateInput.value  = entry?.date  ?? new Date().toISOString().slice(0, 10);

    setTypeToggle(entry?.type ?? "boulder");
    if (entry) selectGradeByValue(entry.grade, entry.type);
    else selectGradeByIndex(0);
    setStatusToggle(entry?.status ?? "send", Boolean(entry?.flash));

    populatePlaces();
    populateAreas(placeInput.value.trim());

    openModal(entryOverlay);
    nameInput.focus();
  }
  addBtn.addEventListener("click", () => openEntryModal(null));
  document.getElementById("entry-close").addEventListener("click", () => closeModal(entryOverlay));
  entryOverlay.addEventListener("click", e => { if (e.target === entryOverlay) closeModal(entryOverlay); });

  document.addEventListener("click", e => {
    const editBtn = e.target.closest(".edit-btn");
    if (!editBtn) return;
    const entry = ALL_ENTRIES.find(x => x.id === editBtn.dataset.editId);
    if (entry) openEntryModal(entry);
  });

  // ── Entry form: submit (online → API, offline → queue) ──────────────
  entryForm.addEventListener("submit", async e => {
    e.preventDefault();
    entrySubmitBtn.disabled = true;
    entryMsg.className = "hidden";

    const place = placeInput.value.trim();
    const name  = nameInput.value.trim();
    const entry = {
      id:     editingId ?? crypto.randomUUID(),
      place,
      area:   areaInput.value.trim(),
      name,
      grade:  selectedGrade,
      type:   selectedType,
      status: selectedStatus,
      flash:  isFlash,
      date:   dateInput.value.trim() || null,
      notes:  notesInput.value.trim() || null,
      video:  videoInput.value.trim() || null,
    };
    const op = editingId ? "edit" : "add";

    try {
      const res = await fetch(ADMIN_DATA_URL, {
        method: editingId ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(entry),
      });
      const data = await res.json();
      if (!res.ok) {
        entryMsg.textContent = data.error ?? `Error ${res.status}`;
        entryMsg.className = "mt-[.85rem] px-4 py-3 rounded-app text-[.9rem] bg-[color-mix(in_srgb,#f87171_12%,var(--color-surface))] border border-[color-mix(in_srgb,#f87171_40%,transparent)] text-red-400";
        entrySubmitBtn.disabled = false;
        return;
      }
      ALL_ENTRIES = data.entries;
      localStorage.setItem(ENTRIES_CACHE_KEY, JSON.stringify(ALL_ENTRIES));
      applyPendingToEntries();
      closeModal(entryOverlay);
      render();
    } catch (err) {
      // Offline (or server unreachable) — queue for later sync, and
      // reflect the change locally so it shows up right away.
      const queue = getQueue();
      const existingIdx = queue.findIndex(item => item.entry.id === entry.id);
      if (existingIdx !== -1) queue[existingIdx] = { op: queue[existingIdx].op, entry };
      else queue.push({ op, entry });
      setQueue(queue);
      applyPendingToEntries();
      closeModal(entryOverlay);
      render();
    }

    entrySubmitBtn.disabled = false;
  });

  // ── Entry form: delete (online → API, offline → queue) ───────────────
  entryDeleteBtn.addEventListener("click", async () => {
    if (!editingId) return;
    if (!confirm(`Delete "${nameInput.value.trim()}"? This can't be undone.`)) return;

    entryDeleteBtn.disabled = true;
    entryMsg.className = "hidden";
    const id = editingId;

    // If this entry only ever existed as a queued, unsynced "add", there's
    // nothing on the server to delete — just drop it from the queue.
    const queuedAdd = getQueue().find(item => item.entry.id === id && item.op === "add");
    if (queuedAdd) {
      setQueue(getQueue().filter(item => item.entry.id !== id));
      ALL_ENTRIES = ALL_ENTRIES.filter(e => e.id !== id);
      closeModal(entryOverlay);
      entryDeleteBtn.disabled = false;
      render();
      return;
    }

    try {
      const res = await fetch(`${ADMIN_DATA_URL}?id=${encodeURIComponent(id)}`, { method: "DELETE" });
      const data = await res.json();
      if (!res.ok) {
        entryMsg.textContent = data.error ?? `Error ${res.status}`;
        entryMsg.className = "mt-[.85rem] px-4 py-3 rounded-app text-[.9rem] bg-[color-mix(in_srgb,#f87171_12%,var(--color-surface))] border border-[color-mix(in_srgb,#f87171_40%,transparent)] text-red-400";
        entryDeleteBtn.disabled = false;
        return;
      }
      ALL_ENTRIES = data.entries;
      localStorage.setItem(ENTRIES_CACHE_KEY, JSON.stringify(ALL_ENTRIES));
      applyPendingToEntries();
      closeModal(entryOverlay);
      render();
    } catch (err) {
      // Offline (or server unreachable) — queue for later sync, and
      // remove it locally so it disappears from the list right away.
      const queue = getQueue().filter(item => item.entry.id !== id);
      queue.push({ op: "delete", entry: { id } });
      setQueue(queue);
      ALL_ENTRIES = ALL_ENTRIES.filter(e => e.id !== id);
      closeModal(entryOverlay);
      render();
    }

    entryDeleteBtn.disabled = false;
  });

  // ── Event delegation (list controls) ─────────────────────────────────
  document.addEventListener("click", e => {
    // Filter popover toggle
    if (e.target.closest("#filter-btn")) {
      const willOpen = filterPanel.hidden;
      filterPanel.hidden = !willOpen;
      filterBtn.setAttribute("aria-expanded", String(willOpen));
      return;
    }

    // Click away closes the filter popover
    if (!filterPanel.hidden && !e.target.closest(".filter-wrap")) {
      filterPanel.hidden = true;
      filterBtn.setAttribute("aria-expanded", "false");
    }

    // Clear filters
    if (e.target.closest("#filter-clear-btn")) {
      state.statusFilters.clear();
      state.typeFilters.clear();
      render();
      return;
    }

    // Collapse/expand all place sections
    if (e.target.closest("#collapse-all-btn")) {
      const places = groupByPlace(filteredEntries()).map(([place]) => place);
      const allCollapsed = places.length > 0 && places.every(p => state.collapsed.has(p));
      if (allCollapsed) places.forEach(p => state.collapsed.delete(p));
      else places.forEach(p => state.collapsed.add(p));
      render();
      return;
    }

    // Status filter (multi-select)
    const statusFilterBtn = e.target.closest("#filter-status-group .toggle-btn");
    if (statusFilterBtn) {
      const filter = statusFilterBtn.dataset.filter;
      if (state.statusFilters.has(filter)) state.statusFilters.delete(filter);
      else state.statusFilters.add(filter);
      render();
      return;
    }

    // Type toggle (filter, not entry form)
    const typeBtn = e.target.closest("#type-toggle .type-btn");
    if (typeBtn) {
      const type = typeBtn.dataset.type;
      if (state.typeFilters.has(type)) state.typeFilters.delete(type);
      else state.typeFilters.add(type);
      render();
      return;
    }

    // Sort header
    const sortTh = e.target.closest("th[data-sort]");
    if (sortTh) {
      toggleSort(sortTh);
      return;
    }

    // Collapse toggle
    const header = e.target.closest(".place-header");
    if (header) {
      toggleCollapse(header);
      return;
    }
  });

  document.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;

    const sortTh = e.target.closest?.("th[data-sort]");
    if (sortTh) {
      e.preventDefault();
      toggleSort(sortTh);
      return;
    }

    const header = e.target.closest?.(".place-header");
    if (header) {
      e.preventDefault();
      toggleCollapse(header);
    }
  });

  function toggleSort(sortTh) {
    const place = sortTh.dataset.place;
    const col   = sortTh.dataset.sort;
    const cur   = getSort(place);
    const dir   = cur.col === col && cur.dir === "asc" ? "desc" : "asc";
    state.sortByPlace[place] = { col, dir };
    render();
  }

  function toggleCollapse(header) {
    const place = header.dataset.place;
    if (state.collapsed.has(place)) state.collapsed.delete(place);
    else state.collapsed.add(place);
    render();
  }

  document.getElementById("search").addEventListener("input", e => {
    state.search = e.target.value;
    render();
  });

  // ── PWA: service worker ──────────────────────────────────────────────
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }

  // ── Boot ─────────────────────────────────────────────────────────────
  async function boot() {
    renderGradeOptions();
    selectGradeByIndex(0);

    const sessionPromise = checkSession();
    const athleteModePromise = fetchAthleteMode();

    // Load data (fall back to last-cached entries when offline)
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      ALL_ENTRIES = data.entries ?? [];
      localStorage.setItem(ENTRIES_CACHE_KEY, JSON.stringify(ALL_ENTRIES));
    } catch (err) {
      const cached = localStorage.getItem(ENTRIES_CACHE_KEY);
      if (cached) {
        try { ALL_ENTRIES = JSON.parse(cached); } catch { ALL_ENTRIES = []; }
      } else {
        document.getElementById("loading").innerHTML =
          `<div class="bg-[color-mix(in_srgb,#f87171_10%,var(--color-bg))] border border-[color-mix(in_srgb,#f87171_40%,transparent)] rounded-app px-5 py-4 text-foreground"><strong>Failed to load logbook data</strong><br>${escapeHtml(err.message)}</div>`;
        return;
      }
    }
    applyPendingToEntries();

    // Sections default to collapsed on first load.
    for (const place of new Set(ALL_ENTRIES.map(e => e.place))) {
      state.collapsed.add(place);
    }

    await Promise.all([sessionPromise, athleteModePromise]);

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "";
    render();
  }

  boot();
</script>
</body>
</html>
