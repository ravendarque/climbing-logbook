version: 2
updates:
  # Covers pnpm-lock.yaml -- Dependabot's "npm" ecosystem type supports
  # npm/yarn/pnpm lockfiles, there's no separate "pnpm" type.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
