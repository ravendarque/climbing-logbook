name: Build and deploy a Preview
description: Builds against the preview environment and creates or updates a Cloudflare Preview (#1338). CLOUDFLARE_ENV=preview at build time is what binds the preview database.
inputs:
  name:
    description: The Preview's name, e.g. pr-123 or main
    required: true
  api-token:
    description: Cloudflare API token
    required: true
outputs:
  url:
    description: The Preview URL
    value: ${{ steps.upload.outputs.url }}
runs:
  using: composite
  steps:
    - shell: bash
      run: pnpm run html:build && pnpm run tailwind:build
    - shell: bash
      run: pnpm run deploy:build
      env:
        CLOUDFLARE_ENV: preview
    - id: upload
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        PREVIEW_NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        # Only the URL is printed: the JSON also names the token's owner.
        OUTPUT=$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --tag "$PREVIEW_NAME-$(git rev-parse --short HEAD)" --json)
        URL=$(echo "$OUTPUT" | sed -n '/^{/,$p' | node -e 'let s = ""; process.stdin.on("data", d => (s += d)).on("end", () => console.log(JSON.parse(s).preview?.urls?.[0] ?? ""))')
        if [ -z "$URL" ]; then
          echo "$OUTPUT" | sed '/^{/,$d' >&2
          echo "wrangler preview didn't report a Preview URL -- see its log above." >&2
          exit 1
        fi
        echo "Preview: $URL"
        echo "url=$URL" >> "$GITHUB_OUTPUT"
