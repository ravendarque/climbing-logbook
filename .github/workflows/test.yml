name: Test

# A required check: the trigger stays unconditional, since a required check that never runs blocks the PR.
on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3.0.4
        id: filter
        with:
          # Everything counts except docs and infra, so a new build input can't slip past.
          predicate-quantifier: every
          filters: |
            relevant:
              - '!docs/**'
              - '!**/*.md'
              - '!infra/**'

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      # The ASSETS binding the tests hit serves the 11ty output.
      - run: pnpm run html:build
      - run: pnpm test
      - run: pnpm run tailwind:build
      - run: pnpm run deploy:build
        env:
          CLOUDFLARE_ENV: preview
