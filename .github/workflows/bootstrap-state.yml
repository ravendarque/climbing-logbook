name: Bootstrap Terraform state bucket

# Manual only — this creates the R2 bucket that Terraform's remote state
# lives in. Never runs automatically. Safe to re-run any time, including
# full disaster recovery: it's a no-op if the bucket already exists.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No pnpm install runs here (bootstrap-state.mjs is a
          # self-contained script, only Node builtins) -- v5+'s automatic
          # packageManager-detected caching would otherwise turn on for
          # no benefit, since nothing after this step would ever restore
          # from it.
          package-manager-cache: false
      - run: node scripts/bootstrap-state.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
