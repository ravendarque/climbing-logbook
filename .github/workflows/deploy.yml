name: Deploy

# Deploys are tied to actual releases, not every merge to main: a tag push
# (created by release.yml when a labelled PR merges) is what ships. A
# release: none merge just rides along un-deployed until the next tag. See
# docs/versioning.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm run tailwind:build
      # #391 fixed this exact gap for PR previews (preview.yml) but never
      # got ported here -- production never built these four bundles at
      # all, so /:username/{log,map,performance} and the public
      # /:username page 404'd on their JS bundle (rendering nothing but
      # the static shell's brand header) on every production deploy since
      # #348/#351 first shipped (#405).
      - run: pnpm run map:build
      - run: pnpm run performance:build
      - run: pnpm run log:build
      - run: pnpm run profile:build
      # #302 adds two more (account, account/edit) -- same #405 gap this
      # file's own comment above already describes, caught before merge
      # this time by CI's e2e job actually failing (playwright.config.js's
      # webServer build chain has to list every bundle too, and briefly
      # didn't), not after a real deploy shipped broken pages again.
      - run: pnpm run account:build
      - run: pnpm run account-edit:build
      # #224 -- same #405 gap again: this file (and preview.yml) got
      # missed a third time, caught here the same way as account/
      # account-edit above (CI's e2e job failing against a real preview
      # webServer build, not silently shipping a 404'd page).
      - run: pnpm run account-import:build
      # D1 migrations are never auto-applied by `wrangler deploy` (same
      # gap `wrangler dev` has locally, and `versions upload` had for
      # preview.yml until #323) -- found the hard way: production's D1
      # database sat with zero migrations applied across several real
      # deploys before this step existed. Must run before the deploy step
      # below, not after -- new code landing before its schema exists
      # would 500 on first request that touches the new tables.
      - name: Apply D1 migrations to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply climbing-logbook --remote
      # --env="" is explicit, not decorative: wrangler.jsonc now defines a
      # second environment (env.preview, #222) alongside the top-level one,
      # and wrangler warns/refuses to guess which one you meant once more
      # than one exists. This pins production deploys to the top-level
      # config regardless of what other environments get added later.
      - run: pnpm exec wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
