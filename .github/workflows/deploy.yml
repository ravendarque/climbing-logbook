name: Deploy

# Deploys are tied to actual releases, not every merge to main: a tag push
# (created by release.yml when a labelled PR merges) is what ships. A
# release: none merge just rides along un-deployed until the next tag. See
# docs/versioning.md.
#
# #443/ADR-0020 (docs/adr/0020-beta-environment-shared-data-tag-promotion.md)
# split this into two targets. Every tag deploys to beta unconditionally.
# Production only gets a tag automatically if its diff since the previous
# tag touches migrations/** or infra/** -- schema/infra changes are trusted
# to be tested before merge and ship straight through, everything else
# waits for a deliberate promote.yml run. This is what makes "keep
# schema/infra changes in their own PR, never mixed with app code" load-
# bearing, not just tidy -- see that ADR's own note on this.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags needed to diff this tag against the
          # previous one below -- the default shallow checkout only has
          # the single commit the tag points at.
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      # #760 -- public/**/index.html is now 11ty-generated, gitignored
      # output (not committed) -- without this, every page 404s outright
      # (env.ASSETS.fetch() has nothing to serve), the same class of gap
      # the #391/#405 comment below documents for the JS bundles, just
      # for the page shells this time. html:build covers all 20 pages in
      # one call (11ty's own directory-mirroring), so there's no
      # per-page list here to independently drift the way pages:build's
      # own history warns about.
      - run: pnpm run html:build
      - run: pnpm run tailwind:build
      # #391 fixed this exact gap for PR previews (preview.yml) but never
      # got ported here -- production never built these bundles at all,
      # so /:username/{log,map,performance} and the public /:username
      # page 404'd on their JS bundle (rendering nothing but the static
      # shell's brand header) on every production deploy since #348/#351
      # first shipped (#405). Happened a third time (#224) when a new
      # page's own build step got added to this file and preview.yml but
      # not playwright.config.js's own separate hardcoded list (or vice
      # versa) -- three independent copies of "every page bundle" is what
      # let that keep happening.
      #
      # #774 -- the actual client+Worker build moved below, next to each
      # deploy step: @cloudflare/vite-plugin (deploy:build, package.json)
      # selects which wrangler.jsonc environment a build targets via the
      # CLOUDFLARE_ENV variable at BUILD time, not `wrangler deploy
      # --env=X` at deploy time (that flag has no effect on binding
      # resolution for a Vite-built deploy, confirmed against Cloudflare's
      # own docs) -- so beta and production each need their own separate
      # build, immediately before their own deploy, with CLOUDFLARE_ENV
      # set to match. A single shared build step (like the old
      # client:build call this replaced) can only ever target one
      # environment at a time now.
      # D1 migrations are never auto-applied by `wrangler deploy` (same
      # gap `wrangler dev` has locally, and `versions upload` had for
      # preview.yml until #323) -- found the hard way: production's D1
      # database sat with zero migrations applied across several real
      # deploys before this step existed. Must run before either deploy
      # step below, not after -- new code landing before its schema
      # exists would 500 on first request that touches the new tables.
      # Beta and production share the exact same D1 database (ADR-0020),
      # so this runs once, not once per environment.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply climbing-logbook --remote
      # Only meaningful for the tag-push trigger -- workflow_dispatch is a
      # deliberate manual override (a corrective release, or bootstrapping
      # a version by hand, per release.yml's own comment on why it exists),
      # not part of the automatic classification flow, so it keeps today's
      # exact behavior (production only, unconditionally) instead of
      # guessing a "previous tag" against whatever ref triggered it.
      - name: Determine deploy classification
        id: classify
        if: github.event_name == 'push'
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -A1 "^${CURRENT_TAG}$" | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            echo "No previous tag found -- treating as direct (deploys to both beta and production)."
            echo "direct=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$PREV_TAG" "$CURRENT_TAG" -- migrations/ infra/)
            if [ -n "$CHANGED" ]; then
              echo "Diff since $PREV_TAG touches migrations/ or infra/ -- direct (both beta and production):"
              echo "$CHANGED"
              echo "direct=true" >> "$GITHUB_OUTPUT"
            else
              echo "Diff since $PREV_TAG touches neither migrations/ nor infra/ -- beta only."
              echo "direct=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      # Every tag deploys to beta -- production either gets it too (direct
      # path, above) or waits for a deliberate promote.yml run.
      #
      # #774 -- CLOUDFLARE_ENV=beta on the build, not `wrangler deploy
      # --env=beta` (no effect on a Vite-built deploy) -- see this file's
      # own comment further up. `deploy:build` (package.json) itself
      # refuses to run at all without a recognized CLOUDFLARE_ENV
      # (scripts/require-cloudflare-env.mjs), so a missing or misspelled
      # value here fails this step loudly rather than silently deploying
      # with the wrong environment's bindings. `--env=beta` is kept on
      # the deploy command too, as real (confirmed, not just documented)
      # defense in depth: wrangler still validates it against whichever
      # environment the build actually targeted and throws on a mismatch,
      # even though the docs describe the flag as a no-op post-Vite.
      - name: Deploy to beta
        if: github.event_name == 'push'
        run: pnpm run deploy:build && pnpm exec wrangler deploy --env=beta
        env:
          CLOUDFLARE_ENV: beta
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # CLOUDFLARE_ENV=production (env.production, wrangler.jsonc) is now
      # a real, explicit target -- not an implicit fallback from omitting
      # the variable. `--env=""` pins the deploy-time validation to the
      # same, matching env.production's own explicitness rather than
      # trusting an unnamed default.
      - name: Deploy to production
        if: github.event_name == 'workflow_dispatch' || steps.classify.outputs.direct == 'true'
        run: pnpm run deploy:build && pnpm exec wrangler deploy --env=""
        env:
          CLOUDFLARE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
