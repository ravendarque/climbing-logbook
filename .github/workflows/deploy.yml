name: Deploy

# Deploys are tied to actual releases, not every merge to main: a tag push
# (created by release.yml when a labelled PR merges) is what ships. A
# release: none merge just rides along un-deployed until the next tag. See
# docs/versioning.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tailwind:build
      - run: pnpm run client:build
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
