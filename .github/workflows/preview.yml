name: Preview

# A Cloudflare Preview of the separate preview Worker for each PR, deleted when it closes (#1338). Not a required check, so
# it filters at the trigger.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'infra/**'
      - 'test/**'
      - 'e2e/**'

# A newer push supersedes the older run (#970).
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Dependabot runs get no secrets, so they'd always fail (#895).
    if: github.actor != 'dependabot[bot]' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.upload.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - id: upload
        uses: ./.github/actions/upload-preview
        with:
          name: pr-${{ github.event.pull_request.number }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Comment preview URL on the PR
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          BODY="Preview: $PREVIEW_URL

          Bound to a separate preview D1 database, not production data. Data is rebuilt from main when its seed data or schema changes. Log in with the preview dev account (credentials: repo Settings → Secrets and variables → Actions → \`PREVIEW_DEV_EMAIL\`/\`PREVIEW_DEV_PASSWORD\`)."
          gh pr comment "$PR_NUMBER" --edit-last --body "$BODY" \
            || gh pr comment "$PR_NUMBER" --body "$BODY"

  # A PR only migrates the shared preview database; preview-db.yml rebuilds and seeds it from main (#1291).
  migrate:
    if: github.actor != 'dependabot[bot]' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: Apply D1 migrations to the preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply climbing-logbook-preview --remote --env preview

  # The free plan keeps 100 Previews per Worker; a merged or closed PR's goes straight away.
  cleanup:
    if: github.actor != 'dependabot[bot]' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: Delete the Preview
        run: pnpm exec wrangler preview delete --worker-name climbing-logbook-preview --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
