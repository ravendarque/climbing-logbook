name: Preview

# Uploads a version of the separate climbing-logbook-preview Worker
# (env.preview in wrangler.jsonc, #222) for every PR -- bound to its own D1
# database, never production's. `wrangler versions upload` (not `deploy`)
# never attaches a route or receives production traffic; it just produces a
# reachable preview URL. The alias is stable per PR number, so the same
# comment gets updated across pushes instead of a new one piling up each
# time (mirrors what Cloudflare Pages/native Workers Builds do natively --
# see #222 for why this project uses its own workflow instead of that).
#
# Not a required status check (unlike test.yml/e2e.yml) -- safe to filter
# at the trigger level, no risk of a permanently-blocked PR.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'client/**'
      - 'public/**'
      - 'styles/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/preview.yml'
      - '.github/actions/setup-node-pnpm/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm run tailwind:build
      # #391 -- these were missing entirely, so /map and /performance 404'd
      # on their JS bundle on every preview deployment (public/logbook/
      # map-app.js and performance-app.js are gitignored build output --
      # nothing else ever produces them).
      - run: pnpm run map:build
      - run: pnpm run performance:build
      - run: pnpm run log:build
      - run: pnpm run profile:build
      # #302 adds two more (account, account/edit) -- same #391 gap this
      # file's own comment above already describes.
      - run: pnpm run account:build
      - run: pnpm run account-edit:build
      # D1 migrations aren't auto-applied by `versions upload` any more
      # than `wrangler dev` auto-applies them locally -- the preview D1
      # database (own bootstrap, not Terraform-managed) needs this run
      # explicitly or a PR adding a new migration would 500 on preview
      # with "no such table."
      - name: Apply D1 migrations to the preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply climbing-logbook-preview --remote --env preview
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          OUTPUT=$(pnpm exec wrangler versions upload --env preview --preview-alias "pr-$PR_NUMBER")
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'Version Preview Alias URL: https://\S+' | sed 's/^Version Preview Alias URL: //')
          if [ -z "$URL" ]; then
            echo "Couldn't find a preview alias URL in wrangler's output -- see the log above." >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      # #391 -- resets (not idempotent-insert-only) the shared preview D1
      # on every run and re-seeds a fixed dev user + dataset, so there's
      # always something real to log in and look at, not just an empty
      # schema. The preview URL isn't known until the upload step above
      # produces it, so this can't run any earlier. Known, accepted
      # limitation: this database is shared across every open PR's preview
      # alias, not per-PR (#392 tracks true per-PR isolation as a separate,
      # unscoped idea) -- whichever PR most recently pushed (running this
      # step) "wins" the current shared state.
      - name: Reset and seed preview data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          PREVIEW_DEV_EMAIL: ${{ secrets.PREVIEW_DEV_EMAIL }}
          PREVIEW_DEV_PASSWORD: ${{ secrets.PREVIEW_DEV_PASSWORD }}
          PREVIEW_BETA_INVITE_CODE: ${{ secrets.PREVIEW_BETA_INVITE_CODE }}
        run: node scripts/seed-preview-data.mjs "$PREVIEW_URL"
      - name: Comment preview URL on the PR
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          BODY="Preview: $PREVIEW_URL

          Bound to a separate preview D1 database, not production data. Data resets on every push -- log in with the preview dev account (credentials: repo Settings → Secrets and variables → Actions → \`PREVIEW_DEV_EMAIL\`/\`PREVIEW_DEV_PASSWORD\`)."
          gh pr comment "$PR_NUMBER" --edit-last --body "$BODY" \
            || gh pr comment "$PR_NUMBER" --body "$BODY"
