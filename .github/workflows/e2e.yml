name: E2E

# A required check, so the trigger stays unconditional; see test.yml.
on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3.0.4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            relevant:
              - '!docs/**'
              - '!*.md'
              - '!infra/**'
              # Help pages are Markdown content; test.yml builds them, and no e2e test reads them.
              - '!views/help/**/*.md'

  e2e:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec playwright install --with-deps chromium
      # Cloudflare's public always-passes Turnstile test secret, not a credential.
      - run: echo 'TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA' >> .dev.vars
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
