name: E2E

# Golden-path Playwright suite (#218) -- the top layer of the test
# pyramid, exercising the real rendered app in a real browser against a
# local `wrangler dev` (Miniflare), not the Vitest backend/client layers'
# in-process or extracted-logic coverage. See playwright.config.js for how
# the dev server and seed data get spun up.
#
# `e2e` is a required status check -- see test.yml's own comment for why
# the trigger stays unconditional and skipping instead happens via the
# `changes` job + `e2e`'s own job-level `if:` below.
on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3.0.4 -- pinned to a commit, see test.yml's own comment for why
        id: filter
        with:
          filters: |
            relevant:
              - 'src/**'
              - 'client/**'
              - 'public/**'
              - 'e2e/**'
              - 'scripts/lib/dev-session.mjs'
              - 'migrations/**'
              - 'wrangler.jsonc'
              - 'playwright.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/e2e.yml'
              - '.github/actions/setup-node-pnpm/**'

  e2e:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec playwright install --with-deps chromium
      # CI has no .dev.vars (correctly gitignored, never committed) --
      # this specific value is Cloudflare's own public "always passes"
      # Turnstile test secret (#311), not a real credential, safe to
      # write here. Local `wrangler dev` (this job's webServer, see
      # playwright.config.js) reads the top-level wrangler.jsonc config,
      # not env.preview -- that block's own committed test-secret default
      # doesn't cover this job.
      - run: echo 'TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA' >> .dev.vars
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
