name: E2E

# Golden-path Playwright suite (#218) -- the top layer of the test
# pyramid, exercising the real rendered app in a real browser against a
# local `wrangler dev` (Miniflare), not the Vitest backend/client layers'
# in-process or extracted-logic coverage. See playwright.config.js for how
# the dev server and seed data get spun up.
on:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
