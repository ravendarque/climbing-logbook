name: E2E

# A required check, so the trigger stays unconditional; see test.yml.
on:
  pull_request:

permissions:
  contents: read
  # The paths filter lists a pull request's changed files.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3.0.4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            relevant:
              - '!docs/**'
              - '!*.md'
              - '!infra/**'
              # Help pages are Markdown content; test.yml builds them, and no e2e test reads them.
              - '!views/help/**/*.md'

  e2e:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec playwright install --with-deps chromium
      # Cloudflare's public always-passes Turnstile test secret, not a credential.
      - run: echo 'TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA' >> .dev.vars
      # A test-only value: e2e setup signs its seeded users' session cookies with it.
      - run: echo 'BETTER_AUTH_SECRET=e2e-only-secret-not-used-anywhere-else-0000' >> .dev.vars
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
