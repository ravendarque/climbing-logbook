name: Release

# Fires automatically when a PR merges to main, IF it carries one of the
# release: major/minor/patch labels (applied at review time — see
# docs/versioning.md for what qualifies). No label, no release: docs/infra
# -only/refactor PRs are just never labelled, so they ride along silently.
#
# Only ever pushes a tag — never a commit to main. package.json's version
# field is inert (see docs/versioning.md); the tag is the sole source of
# truth. This also means tagging never touches the branch-protection
# ruleset on main, since that only covers branch refs, not tags.
#
# workflow_dispatch stays available as a manual override/fallback (e.g. a
# corrective release, or bootstrapping a version by hand).
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (see docs/versioning.md for what qualifies)"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

# PRs can merge close together; serialize releases so each run computes the
# next version from the actual latest tag rather than racing another run
# reading the same stale "latest tag" before either has pushed.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  determine-bump:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.resolve.outputs.bump }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bump=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$labels" | grep -q "release: major"; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif echo "$labels" | grep -q "release: minor"; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif echo "$labels" | grep -q "release: patch"; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "bump=" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: determine-bump
    if: needs.determine-bump.outputs.bump != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # A tag pushed with the default GITHUB_TOKEN doesn't trigger other
          # workflows (GitHub's anti-recursion protection) -- deploy.yml's
          # `push: tags: ['v*']` needs a real-user push. PROJECT_STATUS_PAT
          # (public_repo scope) already exists for the board-sync workflow
          # and covers push access here too, so it's reused rather than
          # minting a new secret. See #197.
          token: ${{ secrets.PROJECT_STATUS_PAT }}

      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      - name: Calculate new version from latest tag
        id: version
        run: |
          CURRENT=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          NEW=$(pnpm exec semver -i ${{ needs.determine-bump.outputs.bump }} "$CURRENT")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.new }}" -m "v${{ steps.version.outputs.new }}"
          git push origin "v${{ steps.version.outputs.new }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.new }}" \
            --title "v${{ steps.version.outputs.new }}" \
            --generate-notes
