name: Release

# Fires automatically when a PR merges to main, IF it carries one of the
# release: major/minor/patch labels (applied at review time — see
# docs/versioning.md for what qualifies). No label, no release: docs/infra
# -only/refactor PRs are just never labelled, so they ride along silently.
#
# Only ever pushes a tag — never a commit to main. package.json's version
# field is inert (see docs/versioning.md); the tag is the sole source of
# truth. This also means tagging never touches the branch-protection
# ruleset on main, since that only covers branch refs, not tags.
#
# workflow_dispatch stays available as a manual override/fallback (e.g. a
# corrective release, or bootstrapping a version by hand).
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (see docs/versioning.md for what qualifies)"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

# PRs can merge close together; serialize releases so each run computes the
# next version from the actual latest tag rather than racing another run
# reading the same stale "latest tag" before either has pushed.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  determine-bump:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.resolve.outputs.bump }}
    steps:
      - id: resolve
        env:
          BUMP_INPUT: ${{ inputs.bump }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "bump=$BUMP_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels="$LABELS"
          if echo "$labels" | grep -q "release: major"; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif echo "$labels" | grep -q "release: minor"; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif echo "$labels" | grep -q "release: patch"; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "bump=" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: determine-bump
    if: needs.determine-bump.outputs.bump != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A tag pushed with the default GITHUB_TOKEN doesn't trigger deploy.yml (#197); the App's short-lived token does (#1069).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup-node-pnpm

      - name: Calculate new version from latest tag
        id: version
        env:
          BUMP: ${{ needs.determine-bump.outputs.bump }}
        run: |
          CURRENT=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          NEW=$(pnpm exec semver -i "$BUMP" "$CURRENT")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: v${{ steps.version.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.version.outputs.new }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes
