name: Release

# Fires automatically when a PR merges to main, IF it carries one of the
# release: major/minor/patch labels (applied at review time — see
# docs/versioning.md for what qualifies). No label, no release: docs/infra
# -only/refactor PRs are just never labelled, so they ride along silently.
#
# Only ever pushes a tag — never a commit to main. package.json's version
# field is inert (see docs/versioning.md); the tag is the sole source of
# truth. This also means tagging never touches the branch-protection
# ruleset on main, since that only covers branch refs, not tags.
#
# workflow_dispatch stays available as a manual override/fallback (e.g. a
# corrective release, or bootstrapping a version by hand).
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (see docs/versioning.md for what qualifies)"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

# PRs can merge close together; serialize releases so each run computes the
# next version from the actual latest tag rather than racing another run
# reading the same stale "latest tag" before either has pushed.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Every merged PR runs this, labelled or not: a run tags every released PR since the latest tag, so a run GitHub
  # cancelled while it waited (the concurrency group keeps only one waiting) loses nothing (#1512).
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # The PR's own merge commit, not main's tip: a PR merged moments later would otherwise get this tag too (#1509).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the tags
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          node scripts/plan-releases.mjs > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          echo "count=$(jq length "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

      # A tag pushed with the default GITHUB_TOKEN doesn't trigger deploy.yml (#197). The App's token does, so it's
      # minted only now and handed to git push alone (#1069).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.plan.outputs.count != '0'
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create and push the tags, oldest first
        if: steps.plan.outputs.count != '0'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          jq -c '.[]' "$RUNNER_TEMP/plan.json" | while read -r release; do
            version=$(jq -r .version <<< "$release")
            jq -r .message <<< "$release" > "$RUNNER_TEMP/tag-message"
            git tag -a "$version" --cleanup=whitespace -F "$RUNNER_TEMP/tag-message" "$(jq -r .sha <<< "$release")"
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$version"
            gh release create "$version" --repo "$GITHUB_REPOSITORY" --title "$version" --generate-notes
          done
