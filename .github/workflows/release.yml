name: Release

# Fires automatically when a PR merges to main, IF it carries one of the
# release: major/minor/patch labels (applied at review time — see
# docs/versioning.md for what qualifies). No label, no release: docs/infra
# -only/refactor PRs are just never labelled, so they ride along silently.
#
# workflow_dispatch stays available as a manual override/fallback (e.g. a
# corrective release, or bootstrapping a version by hand).
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (see docs/versioning.md for what qualifies)"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  determine-bump:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.resolve.outputs.bump }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bump=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$labels" | grep -q "release: major"; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif echo "$labels" | grep -q "release: minor"; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif echo "$labels" | grep -q "release: patch"; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "bump=" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: determine-bump
    if: needs.determine-bump.outputs.bump != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      - name: Calculate new version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          NEW=$(pnpm exec semver -i ${{ needs.determine-bump.outputs.bump }} "$CURRENT")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Bump package.json, commit, and tag
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.new }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v${{ steps.version.outputs.new }}"
          git tag -a "v${{ steps.version.outputs.new }}" -m "v${{ steps.version.outputs.new }}"
          git push origin main
          git push origin "v${{ steps.version.outputs.new }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.new }}" \
            --title "v${{ steps.version.outputs.new }}" \
            --generate-notes
