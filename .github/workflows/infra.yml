name: Infra

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
      TF_VAR_support_forward_email: ${{ secrets.TF_VAR_support_forward_email }}
      TF_VAR_betterstack_api_token: ${{ secrets.BETTERSTACK_API_TOKEN }}
      TF_VAR_discord_alerts_webhook: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
      TF_VAR_discord_monitoring_webhook: ${{ secrets.DISCORD_MONITORING_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.9"

      - run: terraform init

      # #1075 -- apply runs unattended on every push to main, so the plan is
      # the only thing a human ever reads. Plan to a file on every event,
      # refuse any delete (a replacement is delete+create, so this catches
      # those too), then apply exactly the plan that was checked -- never a
      # fresh one computed after the check. On a PR the same guard turns the
      # check red before merge. A deliberate removal isn't done here: run it
      # locally with the plan in front of you (infra/README.md).
      - name: Plan
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Refuse deletes and replacements
        run: |
          DELETES=$(terraform show -json tfplan | jq -r '(.resource_changes // [])[] | select(.change.actions | index("delete")) | "\(.address) (\(.change.actions | join(", ")))"')
          if [ -n "$DELETES" ]; then
            echo "::error::This plan deletes or replaces resources. Unattended apply refuses to do that (#1075):"
            echo "$DELETES"
            exit 1
          fi
          echo "No deletes or replacements in this plan."

      - name: Apply (main only)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -no-color -input=false tfplan

      - name: Sync wrangler.jsonc D1 database id
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          D1_ID=$(cd infra && terraform output -raw d1_database_id)
          node -e "
            const fs = require('node:fs');
            const path = 'wrangler.jsonc';
            const current = fs.readFileSync(path, 'utf8');
            const updated = current.replace(
              /(\"binding\":\s*\"LOGBOOK_DB\",\s*\"database_name\":\s*\"[^\"]*\",\s*\"database_id\":\s*\")[^\"]*(\")/,
              \`\$1${D1_ID}\$2\`
            );
            if (updated !== current) {
              fs.writeFileSync(path, updated);
              console.log('wrangler.jsonc updated with D1 database id ' + '${D1_ID}');
            } else {
              console.log('wrangler.jsonc already up to date');
            }
          "

      - name: Sync the Turnstile sitekey
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          SITEKEY=$(cd infra && terraform output -raw turnstile_sitekey)
          node -e "
            const fs = require('node:fs');
            const path = 'client/turnstile.js';
            const current = fs.readFileSync(path, 'utf8');
            const updated = current.replace(
              /const REAL_SITEKEY = \"[^\"]*\";/,
              'const REAL_SITEKEY = \"${SITEKEY}\";'
            );
            if (updated !== current) {
              fs.writeFileSync(path, updated);
              console.log('turnstile.js updated with ' + '${SITEKEY}');
            } else {
              console.log('turnstile.js already up to date');
            }
          "

      - name: Sync the admin Access audience
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          AUD=$(cd infra && terraform output -raw admin_access_aud)
          node -e "
            const fs = require('node:fs');
            const path = 'wrangler.jsonc';
            const current = fs.readFileSync(path, 'utf8');
            const updated = current.replace(/(\"ACCESS_AUD\":\s*\")[^\"]*(\")/g, \`\$1${AUD}\$2\`);
            if (updated !== current) {
              fs.writeFileSync(path, updated);
              console.log('wrangler.jsonc updated with the admin Access audience');
            } else {
              console.log('wrangler.jsonc already up to date');
            }
          "

      # Actions may not open PRs here (repo setting kept off on purpose, #1272), so a person opens it.
      - name: Push generated config for a PR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc infra/.terraform.lock.hcl client/turnstile.js
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          BRANCH="ci/sync-generated-config-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: sync generated infra config"
          git push origin "$BRANCH"

          URL="${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1"
          echo "::warning::Generated config changed. Open a PR from $BRANCH, label it release: patch, and merge it: $URL"
          {
            echo "## Generated config changed"
            echo
            echo "Terraform-derived config (D1 database id, Turnstile sitekey, admin Access audience, provider lockfile) changed in this apply."
            echo
            echo "[Open the PR]($URL), label it \`release: patch\` (these files ship), and merge it. Merging cuts the release that carries the change."
          } >> "$GITHUB_STEP_SUMMARY"
