# Three days, not pnpm 11's default one: long enough for a compromised release to be caught and pulled (#1040).
minimumReleaseAge: 4320

allowBuilds:
  '@parcel/watcher': true
  # better-auth (real runtime dependency, #20) lists both of these as
  # optional adapters it can auto-detect (native SQLite / Prisma) --
  # irrelevant here, since server/lib/auth.js always passes the real D1
  # binding as `database`, never a better-sqlite3 or Prisma instance, so
  # neither dispatch branch ever runs. Declined, not approved -- no native
  # build needed for a code path this app never exercises.
  '@prisma/client': false
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

# Transitive security fixes ahead of the packages that pull them in, each scoped to the major line it fixes.
overrides:
  undici@7: '>=7.29.0'
  nanoid@3: '^3.3.17'
  sharp@<0.35.5: '^0.35.5'
  shell-quote@1: '^1.12.0'
  source-map-js@1: '^1.2.2'
  brace-expansion@1: '^1.1.21'
  markdown-it@14: '^14.3.3'

patchedDependencies:
  '@cloudflare/vitest-plugin@1.4.4': patches/@cloudflare__vitest-plugin@1.4.4.patch
